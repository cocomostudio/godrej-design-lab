version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/repo
    overwrite: true
hooks:
  BeforeInstall:
    - location: scripts/clean.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/chown.sh
      timeout: 30
      runas: root
    - location: scripts/deploy.sh
      timeout: 300
      runas: ec2-user
